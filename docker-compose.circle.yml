version: "3.8"
services:
  focal:
    image: quay.io/stackstorm/packagingrunner
    extends:
      file: docker-compose.override.yml
      service: suite-compose
    environment:
      - BUILDNODE=focalbuild
      - TESTNODE=focaltest
      - ST2_PACKAGES=st2
    links:
      - focalbuild
      - focaltest
      - rabbitmq
      - mongodb
      - redis

  jammy:
    image: quay.io/stackstorm/packagingrunner
    extends:
      file: docker-compose.override.yml
      service: suite-compose
    environment:
      - BUILDNODE=jammybuild
      - TESTNODE=jammytest
      - ST2_PACKAGES=st2
    links:
      - jammybuild
      - jammytest
      - rabbitmq
      - mongodb
      - redis

  el8:
    image: quay.io/stackstorm/packagingrunner
    extends:
      file: docker-compose.override.yml
      service: suite-compose
    environment:
      - BUILDNODE=rockylinux8build
      - TESTNODE=rockylinux8test
      - ST2_PACKAGES=st2
    links:
      - rockylinux8build
      - rockylinux8test
      - rabbitmq
      - mongodb
      - redis

  el9:
    image: quay.io/stackstorm/packagingrunner
    extends:
      file: docker-compose.override.yml
      service: suite-compose
    environment:
      - BUILDNODE=rockylinux9build
      - TESTNODE=rockylinux9test
      - ST2_PACKAGES=st2
    links:
      - rockylinux9build
      - rockylinux9test
      - rabbitmq
      - mongodb
      - redis

  el10:
    image: stackstorm/packagingrunner:latest
    working_dir: /root/st2-packages
    volumes_from:
      - container:st2-packages-vol
    environment:
      - BUILDNODE=rockylinux10build
      - TESTNODE=rockylinux10test
    links:
      - rockylinux10build
      - rockylinux10test
      - rabbitmq
      - mongodb
      - redis

  # el9/el10 packages built on Rocky Linux and tested on Red Hat UBI
  rhel9:
    image: stackstorm/packagingrunner:latest
    working_dir: /root/st2-packages
    volumes_from:
      - container:st2-packages-vol
    environment:
      - BUILDNODE=rockylinux9build
      - TESTNODE=rhel9test
    links:
      - rockylinux9build
      - rhel9test
      - rabbitmq
      - mongodb
      - redis

  rhel10:
    image: stackstorm/packagingrunner:latest
    working_dir: /root/st2-packages
    volumes_from:
      - container:st2-packages-vol
    environment:
      - BUILDNODE=rockylinux10build
      - TESTNODE=rhel10test
    links:
      - rockylinux10build
      - rhel10test
      - rabbitmq
      - mongodb
      - redis

  ## Package build nodes
  #
  focalbuild:
    image: stackstorm/packagingbuild:focal
    volumes_from:
      - st2-packages-vol

  jammybuild:
    image: stackstorm/packagingbuild:jammy
    volumes_from:
      - st2-packages-vol

  rockylinux8build:
    image: stackstorm/packagingbuild:rockylinux8
    extends:
      file: docker-compose.override.yml
      service: volumes-compose

  rockylinux9build:
    image: stackstorm/packagingbuild:rockylinux9
    extends:
      file: docker-compose.override.yml
      service: volumes-compose

  rockylinux10build:
    image: stackstorm/packagingbuild:rockylinux10
    extends:
      file: docker-compose.override.yml
      service: volumes-compose

  ## Package testing nodes
  #
  focaltest:
    image: stackstorm/packagingtest:focal-systemd
    privileged: true
    volumes_from:
      - st2-packages-vol
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  jammytest:
    image: stackstorm/packagingtest:jammy-systemd
    privileged: true
    volumes_from:
      - st2-packages-vol
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  rockylinux8test:
    image: stackstorm/packagingtest:rockylinux8-systemd
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup

  rockylinux9test:
    image: stackstorm/packagingtest:rockylinux9-systemd
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup

  rockylinux10test:
    image: stackstorm/packagingtest:rockylinux10-systemd
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup

  # The RHEL test images are not published; they are built from st2packaging-dockerfiles.
  # Set PACKAGINGTEST_GITCONTEXT to build them from another repository or branch.
  rhel9test:
    image: stackstorm/packagingtest:rhel9
    build:
      context: ${PACKAGINGTEST_GITCONTEXT:-https://github.com/dcalvoalonso/st2packaging-dockerfiles.git#feature/rhel-test-images}
      dockerfile: packagingtest/rhel9/Dockerfile
    pull_policy: build
    privileged: true
    cgroup: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes_from:
      - container:st2-packages-vol
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup

  rhel10test:
    image: stackstorm/packagingtest:rhel10
    build:
      context: ${PACKAGINGTEST_GITCONTEXT:-https://github.com/dcalvoalonso/st2packaging-dockerfiles.git#feature/rhel-test-images}
      dockerfile: packagingtest/rhel10/Dockerfile
    pull_policy: build
    privileged: true
    cgroup: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes_from:
      - container:st2-packages-vol
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup

  rabbitmq:
    image: rabbitmq:3.12-management
    privileged: true
    hostname: rabbit
    ports:
      - "15672:15672"  # managment plugin port
      - "5672:5672"

  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"

  redis:
    image: redis:8.10
    ports:
      - "6379:6379"
